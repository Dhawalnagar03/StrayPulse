name: straypulse_mobile
description: StrayPulse — AI-Powered Stray Animal Location Prediction Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.12.1
  cached_network_image: ^3.3.1

  # UI
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Charts
  fl_chart: ^0.68.0
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  flutter_dotenv: ^6.0.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env